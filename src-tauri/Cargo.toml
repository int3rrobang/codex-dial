[package]
name = "codex-dial"
version = "1.0.3"
description = "Codex usage dial for Windows"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61.3", features = ["UI_ViewManagement"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
